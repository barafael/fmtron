# Builds the online RON formatter (wasm/ + www/) and deploys it to GitHub
# Pages. The repository's Pages source must be set to "GitHub Actions"
# (Settings → Pages), once.
name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain and its components. Install
      # it explicitly rather than relying on rustup's auto-install, which
      # some rustup versions and images turn off; the wasm target is extra.
      - run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Lint and test the wasm crate
        working-directory: wasm
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Syntax-check the page scripts
        run: cp www/main.js /tmp/main.mjs && node --check /tmp/main.mjs
      - name: Test the highlighter and the structural view's parser
        run: |
          node --test www/test/highlight.test.mjs
          node --test www/test/structure.test.mjs
      - name: Build fmtron-wasm
        working-directory: wasm
        run: cargo build --release --target wasm32-unknown-unknown
      # The glue must be generated by a CLI whose version matches the
      # `wasm-bindgen` crate. The crate is exact-pinned in wasm/Cargo.toml, so
      # the lockfile is the single source of truth for both.
      - name: Install wasm-bindgen-cli from the prebuilt release
        working-directory: wasm
        env:
          # sha256 of wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, ""); print; exit}' Cargo.lock)
          echo "wasm-bindgen from the lockfile: $version"
          grep -qF "wasm-bindgen = \"=$version\"" Cargo.toml
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" -o /tmp/wasm-bindgen.tgz
          # The CLI writes the JavaScript every visitor runs, so the release
          # asset is checked against a pinned digest. Update it together
          # with the version in Cargo.toml.
          echo "$WASM_BINDGEN_SHA256  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          tar xzf /tmp/wasm-bindgen.tgz -C /tmp
          install "/tmp/wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin"
          wasm-bindgen --version
      - name: Generate wasm glue
        working-directory: wasm
        run: >
          wasm-bindgen --target web --out-dir ../www/pkg
          target/wasm32-unknown-unknown/release/fmtron_wasm.wasm
      - uses: actions/configure-pages@v5
      # The Node test suite lives under www/ for import-path reasons but is
      # not part of the site; stage the artifact without it.
      - name: Stage the site
        run: |
          rm -rf /tmp/site
          cp -r www /tmp/site
          rm -rf /tmp/site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
