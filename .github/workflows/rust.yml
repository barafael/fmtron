name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Installs the toolchain pinned in rust-toolchain.toml explicitly rather
    # than relying on rustup's auto-install on first use.
    - run: rustup show
    - name: Formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    # Fails if fmtron's output changed; see tests/stability.rs.
    - name: Output stability
      run: cargo test --test stability
    - name: Run tests
      run: cargo test --verbose
    # The library alone, as a web page or editor plugin would embed it.
    - name: Library without the CLI, for wasm
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --lib --no-default-features --target wasm32-unknown-unknown

  # The fmt.ron editor (ui/), a leaf crate of its own workspace.
  ui:
    name: fmt.ron.ui
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: rustup show
    - name: Windowing headers for eframe
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ui
    - name: Lint and test
      working-directory: ui
      run: |
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test
    - name: Lint for the browser
      working-directory: ui
      run: |
        rustup target add wasm32-unknown-unknown
        cargo clippy --target wasm32-unknown-unknown -- -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88.0
    - run: cargo +1.88.0 check --all-targets --all-features
