[package]
name = "fmtron-ui"
version = "0.1.0"
edition = "2024"
# eframe 0.36 needs 1.95.
rust-version = "1.95"
description = "fmt.ron.ui: an editor for fmtron's fmt.ron configuration file"
license = "MIT"
repository = "https://github.com/barafael/fmtron"
# Not on crates.io.
publish = false

# A leaf crate of its own workspace, like wasm/; the fmtron library is a
# path dependency.
[workspace]

[dependencies]
fmtron = { path = "..", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36.2"
# File dialogs; on wasm32 it wraps the browser's picker and download.
rfd = "0.17.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: the wasm-bindgen CLI that generates the glue (see
# .github/workflows/pages.yml) must have the same version as wasm/Cargo.toml.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "KeyboardEvent",
  "EventTarget",
] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
# Drives the app offscreen with simulated keys; see app.rs's tests.
egui_kittest = { version = "0.36.2", default-features = false, features = ["eframe"] }
