<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fmt.ron.ui</title>
    <meta name="description" content="An editor for fmtron's fmt.ron configuration file." />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d2021; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
                 font: 16px system-ui, sans-serif; color: #bdae93; }
    </style>
  </head>
  <body>
    <canvas id="fmtron_ui_canvas"></canvas>
    <p id="loading">Loading fmt.ron.ui…</p>
    <script type="module">
      // The glue is generated by wasm-bindgen; see .github/workflows/pages.yml.
      import init from "./pkg/fmtron_ui.js";
      init().catch((e) => {
        document.getElementById("loading").textContent = `fmt.ron.ui failed to start: ${e}`;
      });
    </script>
  </body>
</html>
