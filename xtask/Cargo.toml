[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Repository automation for fmtron (goldens, matrix audit, matrix site, wild corpus, style comparisons)."

[dependencies]
flate2 = "1.1"
fmtron = { path = "..", default-features = false }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
unicode-width = "0.2"
ureq = "3.5"
